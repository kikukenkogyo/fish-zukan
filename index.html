<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0077b6">
<title>釣果図鑑</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#0077b6;--primary-light:#00b4d8;--primary-dark:#023e8a;
  --bg:#f0f8ff;--card:#fff;--text:#1a1a2e;--text-sub:#555;
  --accent:#ff6b35;--safe-bottom:env(safe-area-inset-bottom,0px);
  --success:#2ecc71;--google:#4285f4;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* ===== Header ===== */
.header{background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;z-index:10}
.header h1{font-size:20px;font-weight:700;flex:1}
.header .logo{font-size:28px}
.header .catch-count{font-size:13px;opacity:.85;font-weight:500}

/* ===== Main scrollable area ===== */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 100px}

/* ===== Catches grid ===== */
.catches-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.catch-card{background:var(--card);border-radius:16px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s;
  position:relative}
.catch-card:active{transform:scale(.97)}
.catch-card .catch-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.catch-card .catch-info{padding:10px 12px}
.catch-card .catch-name{font-size:15px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.catch-card .catch-date{font-size:11px;color:var(--text-sub);margin-top:2px}
.catch-card .catch-note{font-size:11px;color:var(--primary);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Empty state ===== */
.empty-state{text-align:center;padding:80px 20px}
.empty-state .empty-icon{font-size:80px;margin-bottom:16px}
.empty-state p{font-size:16px;color:var(--text);font-weight:600}
.empty-state .empty-sub{font-size:14px;color:var(--text-sub);margin-top:8px;font-weight:normal}

/* ===== Detail overlay ===== */
.detail-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;
  display:none;flex-direction:column;overflow:hidden}
.detail-overlay.open{display:flex}
.detail-header{display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff}
.detail-header .back-btn{background:none;border:none;color:#fff;font-size:24px;
  cursor:pointer;padding:4px 8px}
.detail-header h2{font-size:18px;font-weight:700;flex:1}
.detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}
.detail-photo{width:100%;max-height:50vh;object-fit:contain;background:#000}
.detail-info{padding:16px}
.detail-name{font-size:24px;font-weight:700;margin-bottom:4px}
.detail-date{font-size:13px;color:var(--text-sub);margin-bottom:16px}
.detail-note{font-size:14px;line-height:1.6;padding:12px;background:var(--card);
  border-radius:12px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap}
.detail-actions button{flex:1;min-width:80px;padding:12px;border:none;border-radius:12px;
  font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s}
.detail-actions button:active{transform:scale(.96)}
.btn-lens{background:var(--google);color:#fff}
.btn-edit{background:#e8ecf0;color:var(--text)}
.btn-delete{background:#fee;color:#e55}

/* ===== Camera overlay ===== */
.camera-overlay{position:fixed;inset:0;background:#000;z-index:200;
  display:none;flex-direction:column}
.camera-overlay.open{display:flex}
.camera-top{display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;color:#fff;background:rgba(0,0,0,.6);z-index:1;flex-shrink:0}
.camera-top button{background:none;border:none;color:#fff;font-size:16px;
  cursor:pointer;padding:6px 12px}
#video-preview{flex:1;object-fit:cover;width:100%;min-height:0}
#canvas-capture{display:none}
.camera-controls{display:flex;justify-content:center;align-items:center;gap:30px;
  padding:20px;padding-bottom:calc(32px + var(--safe-bottom));background:rgba(0,0,0,.6);
  flex-shrink:0}
.shutter-btn{width:72px;height:72px;border-radius:50%;border:4px solid #fff;
  background:rgba(255,255,255,.3);cursor:pointer;transition:all .15s;position:relative}
.shutter-btn:active{background:rgba(255,255,255,.6);transform:scale(.9)}
.shutter-btn::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#fff}
.gallery-btn-cam{background:none;border:2px solid rgba(255,255,255,.5);color:#fff;
  width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.gallery-btn-cam:active{background:rgba(255,255,255,.2)}

/* ===== Identify overlay ===== */
.identify-overlay{position:fixed;inset:0;background:var(--bg);z-index:210;
  display:none;flex-direction:column}
.identify-overlay.open{display:flex}
.identify-header{display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:linear-gradient(135deg,var(--accent),#ff8c42);color:#fff}
.identify-header button{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.identify-header h2{flex:1;font-size:18px;font-weight:700}
.identify-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px;padding-bottom:100px}
.identify-photo{width:100%;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.15);
  margin-bottom:16px}
.identify-form{background:var(--card);border-radius:16px;padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.06)}
.identify-form label{display:block;font-size:13px;font-weight:600;color:var(--text-sub);
  margin-bottom:6px;margin-top:14px}
.identify-form label:first-child{margin-top:0}
.identify-form input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;
  border-radius:12px;font-size:16px;outline:none;transition:border .2s;
  -webkit-appearance:none}
.identify-form input:focus{border-color:var(--primary)}
.save-btn{width:100%;padding:14px;background:var(--success);color:#fff;border:none;
  border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;
  box-shadow:0 4px 12px rgba(46,204,113,.3);transition:transform .1s}
.save-btn:active{transform:scale(.98)}

/* ===== Bottom Nav ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid #e0e0e0;
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 0 calc(8px + var(--safe-bottom));z-index:50;
  box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;cursor:pointer;color:var(--text-sub);
  font-size:10px;padding:4px 12px;transition:color .2s}
.nav-item.active{color:var(--primary)}
.nav-item .icon{font-size:22px}
.nav-item.camera-nav{position:relative;margin-top:-20px}
.nav-item.camera-nav .icon{width:52px;height:52px;border-radius:50%;
  background:var(--accent);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(255,107,53,.4)}

/* ===== Edit modal ===== */
.edit-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  display:none;align-items:center;justify-content:center;padding:20px}
.edit-modal.open{display:flex}
.edit-content{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px}
.edit-content h3{font-size:18px;font-weight:700;margin-bottom:16px}
.edit-content label{display:block;font-size:13px;font-weight:600;color:var(--text-sub);
  margin-bottom:6px;margin-top:14px}
.edit-content label:first-of-type{margin-top:0}
.edit-content input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;
  border-radius:12px;font-size:16px;outline:none;-webkit-appearance:none}
.edit-content input:focus{border-color:var(--primary)}
.edit-actions{display:flex;gap:10px;margin-top:20px}
.edit-actions button{flex:1;padding:12px;border:none;border-radius:12px;
  font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s}
.edit-actions button:active{transform:scale(.96)}
.edit-save-btn{background:var(--primary);color:#fff}
.edit-cancel-btn{background:#e8ecf0;color:var(--text)}

/* ===== Toast ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:#333;color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;
  font-weight:600;z-index:500;transition:transform .3s ease;
  box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== Animations ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.catch-card{animation:fadeIn .3s ease both}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <span class="logo">🐟</span>
  <h1>釣果図鑑</h1>
  <span class="catch-count" id="catchCount"></span>
</div>

<!-- Main content -->
<div class="main" id="mainArea">
  <div class="catches-grid" id="catchesGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="empty-icon">🎣</div>
    <p>まだ釣果がありません</p>
    <p class="empty-sub">🔍で魚を調べて、📷で撮影して記録しよう！</p>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="scrollToTop()">
    <span class="icon">🐟</span>釣果
  </button>
  <button class="nav-item" onclick="openGoogleLens()">
    <span class="icon">🔍</span>調べる
  </button>
  <button class="nav-item camera-nav" onclick="openCamera()">
    <span class="icon">📷</span>
  </button>
  <button class="nav-item" onclick="pickFromGallery()">
    <span class="icon">🖼️</span>追加
  </button>
</div>

<!-- Hidden file input for gallery import -->
<input type="file" id="galleryInput" accept="image/*" style="display:none">

<!-- Detail overlay -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-header">
    <button class="back-btn" onclick="closeDetail()">←</button>
    <h2 id="detailTitle"></h2>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<!-- Camera overlay -->
<div class="camera-overlay" id="cameraOverlay">
  <div class="camera-top">
    <button onclick="closeCamera()">✕ 閉じる</button>
    <span>🐟 魚を撮影</span>
    <button onclick="flipCamera()">🔄</button>
  </div>
  <video id="video-preview" autoplay playsinline></video>
  <canvas id="canvas-capture"></canvas>
  <div class="camera-controls">
    <button class="gallery-btn-cam" onclick="closeCamera();pickFromGallery()">🖼</button>
    <button class="shutter-btn" onclick="takePhoto()"></button>
    <div style="width:44px"></div>
  </div>
</div>

<!-- Save overlay -->
<div class="identify-overlay" id="identifyOverlay">
  <div class="identify-header">
    <button onclick="closeIdentify()">←</button>
    <h2>📌 釣果を保存</h2>
  </div>
  <div class="identify-body">
    <img id="identifyPhoto" class="identify-photo" alt="撮影した魚">
    <div class="identify-form">
      <label>魚の名前</label>
      <input type="text" id="fishNameInput" placeholder="例: アジ、マダイ…" enterkeyhint="next">
      <label>メモ（任意）</label>
      <input type="text" id="fishNoteInput" placeholder="例: 30cm、堤防で釣った" enterkeyhint="done">
      <button class="save-btn" onclick="saveCatch()">📌 釣果を保存</button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="edit-modal" id="editModal">
  <div class="edit-content">
    <h3>✏️ 釣果を編集</h3>
    <label>魚の名前</label>
    <input type="text" id="editNameInput">
    <label>メモ</label>
    <input type="text" id="editNoteInput">
    <div class="edit-actions">
      <button class="edit-cancel-btn" onclick="closeEditModal()">キャンセル</button>
      <button class="edit-save-btn" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script>
// ==================== State ====================
let myCatches = JSON.parse(localStorage.getItem('myCatches') || '[]');
let currentPhotoDataUrl = null;
let currentEditId = null;
let cameraStream = null;
let facingMode = 'environment';

// ==================== Render Catches ====================
function renderCatches(){
  const grid = document.getElementById('catchesGrid');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('catchCount');

  count.textContent = myCatches.length > 0 ? myCatches.length + '匹' : '';

  if(myCatches.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = myCatches.map((c, i) => `
    <div class="catch-card" style="animation-delay:${i * 0.04}s" onclick="openDetail('${c.id}')">
      <img class="catch-thumb" src="${c.dataUrl}" alt="${c.name}" loading="lazy">
      <div class="catch-info">
        <div class="catch-name">${c.name || '不明な魚'}</div>
        <div class="catch-date">📅 ${c.date}</div>
        ${c.note ? `<div class="catch-note">📝 ${c.note}</div>` : ''}
      </div>
    </div>
  `).join('');
}

// ==================== Detail ====================
function openDetail(id){
  const c = myCatches.find(x => x.id === id);
  if(!c) return;
  document.getElementById('detailTitle').textContent = c.name || '不明な魚';
  document.getElementById('detailBody').innerHTML = `
    <img class="detail-photo" src="${c.dataUrl}" alt="${c.name}">
    <div class="detail-info">
      <div class="detail-name">${c.name || '不明な魚'}</div>
      <div class="detail-date">📅 ${c.date}</div>
      ${c.note ? `<div class="detail-note">📝 ${c.note}</div>` : ''}
      <div class="detail-actions">
        <button class="btn-lens" onclick="openGoogleLens()">🔍 調べる</button>
        <button class="btn-edit" onclick="openEditModal('${c.id}')">✏️ 編集</button>
        <button class="btn-delete" onclick="deleteCatch('${c.id}')">🗑 削除</button>
      </div>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('open');
}

// ==================== Camera ====================
async function openCamera(){
  document.getElementById('cameraOverlay').classList.add('open');
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode, width:{ideal:1280}, height:{ideal:720}}, audio:false
    });
    document.getElementById('video-preview').srcObject = cameraStream;
  }catch(e){
    alert('カメラにアクセスできません。設定を確認してください。');
    closeCamera();
  }
}

function closeCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  document.getElementById('cameraOverlay').classList.remove('open');
}

async function flipCamera(){
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  if(cameraStream) cameraStream.getTracks().forEach(t => t.stop());
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode, width:{ideal:1280}, height:{ideal:720}}, audio:false
    });
    document.getElementById('video-preview').srcObject = cameraStream;
  }catch(e){
    alert('カメラの切り替えに失敗しました');
  }
}

function takePhoto(){
  const video = document.getElementById('video-preview');
  const canvas = document.getElementById('canvas-capture');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  closeCamera();
  resizeImage(dataUrl).then(resized => openIdentify(resized));
}

// ==================== Gallery ====================
function pickFromGallery(){
  document.getElementById('galleryInput').click();
}

document.getElementById('galleryInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    resizeImage(ev.target.result).then(resized => openIdentify(resized));
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

// ==================== Resize (save storage) ====================
function resizeImage(dataUrl, maxDim){
  maxDim = maxDim || 1200;
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w <= maxDim && h <= maxDim){ resolve(dataUrl); return; }
      if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
      else{ w = Math.round(w * maxDim / h); h = maxDim; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.src = dataUrl;
  });
}

// ==================== Identify ====================
function openIdentify(dataUrl){
  currentPhotoDataUrl = dataUrl;
  document.getElementById('identifyPhoto').src = dataUrl;
  document.getElementById('fishNameInput').value = '';
  document.getElementById('fishNoteInput').value = '';
  document.getElementById('identifyOverlay').classList.add('open');
}

function closeIdentify(){
  document.getElementById('identifyOverlay').classList.remove('open');
  currentPhotoDataUrl = null;
}

// ==================== Google Lens ====================
// メイン: Google Lensを直接開く（Lensのカメラで魚を撮影して特定）
function openGoogleLens(){
  window.open('https://www.google.com/', '_blank');
}


// ==================== Save Catch ====================
function saveCatch(){
  if(!currentPhotoDataUrl) return;

  const name = document.getElementById('fishNameInput').value.trim() || '不明な魚';
  const note = document.getElementById('fishNoteInput').value.trim();

  myCatches.unshift({
    id: Date.now().toString(),
    dataUrl: currentPhotoDataUrl,
    name: name,
    note: note,
    date: new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'})
  });

  saveCatchesToStorage();
  saveToDevice(currentPhotoDataUrl, name);
  closeIdentify();
  renderCatches();
  showToast('🐟 釣果を保存しました！');
}

// 端末のライブラリに画像を保存
async function saveToDevice(dataUrl, name){
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (name || 'fish') + '_' + new Date().toISOString().slice(0,10) + '.jpg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){}
}

// ==================== Edit ====================
function openEditModal(id){
  const c = myCatches.find(x => x.id === id);
  if(!c) return;
  currentEditId = id;
  document.getElementById('editNameInput').value = c.name || '';
  document.getElementById('editNoteInput').value = c.note || '';
  document.getElementById('editModal').classList.add('open');
}

function closeEditModal(){
  document.getElementById('editModal').classList.remove('open');
  currentEditId = null;
}

function saveEdit(){
  if(!currentEditId) return;
  const c = myCatches.find(x => x.id === currentEditId);
  if(!c) return;
  c.name = document.getElementById('editNameInput').value.trim() || '不明な魚';
  c.note = document.getElementById('editNoteInput').value.trim();
  saveCatchesToStorage();
  closeEditModal();
  closeDetail();
  renderCatches();
  showToast('✏️ 更新しました');
}

// ==================== Delete ====================
function deleteCatch(id){
  if(!confirm('この釣果を削除しますか？')) return;
  myCatches = myCatches.filter(c => c.id !== id);
  saveCatchesToStorage();
  closeDetail();
  renderCatches();
  showToast('🗑 削除しました');
}

// ==================== Storage ====================
function saveCatchesToStorage(){
  try{
    localStorage.setItem('myCatches', JSON.stringify(myCatches));
  }catch(e){
    while(myCatches.length > 10){ myCatches.pop(); }
    try{
      localStorage.setItem('myCatches', JSON.stringify(myCatches));
    }catch(e2){
      alert('保存容量がいっぱいです。古い釣果を削除してください。');
    }
  }
}

// ==================== Toast ====================
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ==================== Misc ====================
function scrollToTop(){
  document.getElementById('mainArea').scrollTo({top:0, behavior:'smooth'});
}

// ==================== Init ====================
renderCatches();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
